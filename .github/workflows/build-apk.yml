name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css game.js www/
          if [ -d assets ]; then cp -r assets www/; fi
      - name: Install tools
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Android tweaks (landscape and fullscreen)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/styles.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          sed -i '/name="AppTheme.NoActionBar"/a <item name="android:windowFullscreen">true</item>' "$S"
          grep -n "screenOrientation" "$M" || echo "WARNING: orientation not patched"
          grep -n "windowFullscreen" "$S" || echo "WARNING: fullscreen not patched"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iron-crown-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
